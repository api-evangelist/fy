name: Fy
description: >-
  Fy! (iamfy.co) is an online marketplace for wall art and home decor, curating
  canvas prints, framed prints, gallery wall sets, and handmade UK-manufactured
  frames from a community of independent artists. The storefront runs on Shopify
  and offers an AI-powered "Advisor" tool for personalized wall-design
  recommendations, an art-for-business program, and an artists hub for creators.
  Fy was surfaced as a portfolio company of 500 Global and added to the API
  Evangelist network. It publishes no first-party developer API; the only
  machine-readable surface reachable on the domain is the Shopify Customer
  Account OIDC/OAuth discovery served by the platform.
